name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the deployment package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      # The published zip is what the Deploy to Azure button installs via
      # WEBSITE_RUN_FROM_PACKAGE, so it ships production dependencies only —
      # no dev dependencies, no tests, no docs.
      - name: Build the package
        run: |
          rm -rf node_modules
          npm ci --omit=dev
          zip -r surveymonkey-powerbi-connector.zip \
            host.json package.json package-lock.json \
            src public node_modules \
            -x '*.test.js'

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: surveymonkey-powerbi-connector.zip
          generate_release_notes: true
