name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ['18', '20']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # Production dependencies only. The azure-functions-core-tools
      # devDependency downloads a large platform-specific binary that the
      # tests don't need, so skipping it keeps CI fast and less flaky.
      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Run tests
        run: npm test
