name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ['18', '20']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Offline: fixtures only, no Azure resources. Integration tests skip
      # themselves here because STORAGE_CONNECTION_STRING is unset.
      - name: Unit tests
        run: npm test

      # Exercises the storage layer against a real Azure Storage API, which
      # the in-memory fakes in the unit tests cannot cover.
      - name: Start Azurite
        run: |
          npx azurite-blob --location /tmp/azurite --blobPort 10000 --skipApiVersionCheck &
          for i in $(seq 1 30); do
            if nc -z 127.0.0.1 10000; then echo "Azurite ready"; exit 0; fi
            sleep 1
          done
          echo "Azurite failed to start within 30s" >&2
          exit 1

      - name: Integration tests
        run: npm run test:integration
